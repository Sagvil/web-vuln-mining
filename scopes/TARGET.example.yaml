# Configuration zone: copy this file to scopes/<project>.yaml and replace placeholders.
name: PROJECT
source_root: ./PROJECT
base_urls:
  - https://TARGET/
openapi: []
include_hosts:
  - TARGET
exclude_paths:
  - /logout
  - /signout
rate_limit: 5
crawl_budget:
  max_depth: 3
  max_pages: 300
profiles:
  - source
  - web-baseline
  - api
  - verify-xss
  - verify-sqli
  - content-discovery
codeql:
  languages: [javascript, python]
  build_command: ""
auth:
  headers_file: ""
content_discovery:
  # Only the first max_requests lines of --wordlist are used; ffuf does not recurse by default.
  max_requests: 300
  match_statuses: [200, 204, 301, 302, 307, 401, 403]
