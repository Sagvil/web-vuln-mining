  - id: C14
    title: yun 业务 API CORS 任意 Origin 反射 + credentials:true（配置缺陷，利用性受限）
    asset: yun.womanhospital.cn/api/{train,course,exam,record,admin,config}
    severity: low
    status: reproduced
    human_reviewed: true
    scope_confirmed: true
    evidence:
      - "6 端点一致：access-control-allow-origin 反射请求 Origin（https://evil.example.com）+ access-control-allow-credentials: true"
      - "OPTIONS preflight 全放行：PUT/GET 200 + allow-headers: authorization,content-type + credentials:true"
      - "HTTP/2 401（未认证）——利用面为已登录用户浏览器跨域读取（OWASP API8 CORS 误配置）"
      - "认证接口（/api/login /api/auth）无 CORS 反射——业务 API 网关层配置问题"
      - "L3 认证机制分析：SPA JS 使用 localStorage 存 token + Authorization Bearer 头（非 Cookie）→ 跨域 fetch 无法自动携带凭据 → 实际利用性低"
    notes: 降级自 medium（JS 证据链：localStorage Bearer 认证阻断标准 CORS 利用）；配置缺陷确凿，防御性报告价值
