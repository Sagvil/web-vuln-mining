  - id: C10
    title: flexoffice API CORS 通配 + Allow-Credentials true 共存（www）
    asset: www.womanhospital.cn/flexoffice/api/**
    severity: low
    status: reproduced
    human_reviewed: true
    scope_confirmed: true
    evidence:
      - "GET /flexoffice/api/sys/htl/actions/search/ 响应头双份 Access-Control-Allow-Origin: *"
      - "同响应 Access-Control-Allow-Credentials: true（规范禁止组合）"
      - "Access-Control-Allow-Methods: GET,POST,OPTIONS,PUT,DELETE,PATCH（全方法开放）"
      - "复现端点 2 个：search/ 与 updateHits?dataId=...&type=jtjzdjl（Origin: https://evil.example.com 均反射）"
      - "认证机制：Set-Cookie flexsid=...; Path=/flexoffice; HttpOnly; SameSite=Lax → 跨域 fetch 无法携带 flexsid → 标准 CORS 攻击链不可行"
      - "raw: runs/20260822T170945Z-...-web-baseline/raw/zap-passive.json (Cross-Domain Misconfiguration)"
    notes: 降级自 medium（SameSite=Lax 阻断凭据携带）；配置错误确凿（双头违反规范）——防御性报告价值
