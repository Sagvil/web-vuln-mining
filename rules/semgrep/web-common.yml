rules:
  - id: python-sqli-string-format
    languages: [python]
    severity: ERROR
    message: SQL query is assembled with interpolation; use a parameterized query API.
    metadata:
      category: security
      vulnerability: SQL injection
    patterns:
      - pattern-either:
          - pattern: $CURSOR.execute($QUERY % $VALUE)
          - pattern: $CURSOR.execute(f"...{...}...")
  - id: javascript-dom-xss-innerhtml
    languages: [javascript, typescript]
    severity: WARNING
    message: Assignment to innerHTML requires a trusted and encoded value.
    metadata:
      category: security
      vulnerability: cross-site scripting
    pattern: $ELEMENT.innerHTML = $VALUE
  - id: javascript-open-redirect-location
    languages: [javascript, typescript]
    severity: WARNING
    message: Redirect destination must be allowlisted before assigning location.
    metadata:
      category: security
      vulnerability: open redirect
    pattern-either:
      - pattern: window.location = $DESTINATION
      - pattern: location.href = $DESTINATION
  - id: python-ssrf-user-url
    languages: [python]
    severity: WARNING
    message: User-influenced URL passed to an HTTP client requires host allowlisting.
    metadata:
      category: security
      vulnerability: server-side request forgery
    pattern-either:
      - pattern: requests.get($URL, ...)
      - pattern: requests.post($URL, ...)
  - id: python-path-join-user-input
    languages: [python]
    severity: WARNING
    message: Filesystem path includes a variable; validate it stays below the intended root.
    metadata:
      category: security
      vulnerability: path traversal
    pattern: os.path.join($ROOT, $INPUT, ...)
  - id: python-orm-raw-query
    languages: [python]
    severity: ERROR
    message: Raw ORM query input requires parameters or a validated query builder.
    metadata:
      category: security
      vulnerability: SQL injection
    pattern-either:
      - pattern: $QUERYSET.raw($QUERY, ...)
      - pattern: $MODEL.objects.raw($QUERY, ...)
  - id: python-dangerous-template-string
    languages: [python]
    severity: WARNING
    message: Rendering a dynamically constructed template can create server-side template injection.
    metadata:
      category: security
      vulnerability: server-side template injection
    pattern-either:
      - pattern: render_template_string($TEMPLATE, ...)
      - pattern: flask.render_template_string($TEMPLATE, ...)
  - id: python-upload-save-without-validation
    languages: [python]
    severity: WARNING
    message: File upload save requires extension, MIME, size, and storage-path validation.
    metadata:
      category: security
      vulnerability: unrestricted file upload
    pattern: $FILE.save($DESTINATION, ...)
  - id: python-request-to-sql-execute-taint
    languages: [python]
    mode: taint
    severity: ERROR
    message: Request-controlled data reaches a SQL execution API; use parameterized queries.
    metadata:
      category: security
      vulnerability: SQL injection
      cwe: CWE-89
    pattern-sources:
      - pattern-either:
          - pattern: request.args.get(...)
          - pattern: request.form.get(...)
          - pattern: request.json.get(...)
    pattern-sinks:
      - pattern: $CURSOR.execute($QUERY, ...)
  - id: python-request-to-http-client-taint
    languages: [python]
    mode: taint
    severity: WARNING
    message: Request-controlled data reaches an HTTP client; enforce an outbound host allowlist.
    metadata:
      category: security
      vulnerability: server-side request forgery
      cwe: CWE-918
    pattern-sources:
      - pattern-either:
          - pattern: request.args.get(...)
          - pattern: request.form.get(...)
          - pattern: request.json.get(...)
    pattern-sinks:
      - pattern-either:
          - pattern: requests.get($URL, ...)
          - pattern: requests.post($URL, ...)
  - id: python-request-to-template-string-taint
    languages: [python]
    mode: taint
    severity: ERROR
    message: Request-controlled data reaches dynamic template rendering.
    metadata:
      category: security
      vulnerability: server-side template injection
      cwe: CWE-1336
    pattern-sources:
      - pattern-either:
          - pattern: request.args.get(...)
          - pattern: request.form.get(...)
          - pattern: request.json.get(...)
    pattern-sinks:
      - pattern-either:
          - pattern: render_template_string($TEMPLATE, ...)
          - pattern: flask.render_template_string($TEMPLATE, ...)
  - id: javascript-location-to-innerhtml-taint
    languages: [javascript, typescript]
    mode: taint
    severity: WARNING
    message: Location-controlled data reaches innerHTML; sanitize before DOM insertion.
    metadata:
      category: security
      vulnerability: cross-site scripting
      cwe: CWE-79
    pattern-sources:
      - pattern-either:
          - pattern: window.location.search
          - pattern: location.search
          - pattern: new URLSearchParams(window.location.search).get(...)
    pattern-sinks:
      - pattern: $ELEMENT.innerHTML = $VALUE
